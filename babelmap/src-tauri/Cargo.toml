[package]
name = "babelmap"
version = "1.0.0"
edition = "2021"
description = "BabelMap - Unicode Character Map"
authors = ["BabelSoft"]

[package.metadata]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "babelmap_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]
